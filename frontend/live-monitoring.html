<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (!t) t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Monitoring — Smart Monitoring &amp; Inspection System</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.4 19.2 5v5.6c0 5.3-3.1 9.4-7.2 10.9-4.1-1.5-7.2-5.6-7.2-10.9V5L12 2.4z' fill='%2316294B'/%3E%3Ccircle cx='12' cy='11.1' r='3' fill='%23fff'/%3E%3Ccircle cx='12' cy='11.1' r='1.15' fill='%23B8860B'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="mark-row">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2.4 19.2 5v5.6c0 5.3-3.1 9.4-7.2 10.9-4.1-1.5-7.2-5.6-7.2-10.9V5L12 2.4z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="12" cy="11.1" r="3" stroke="currentColor" stroke-width="1.2"/>
          <circle cx="12" cy="11.1" r="1.15" fill="var(--gold)"/>
        </svg>
      </div>
      <span>Smart Monitoring<br />&amp; Inspection</span>
    </div>

    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="index.html">Projects</a>
      <a href="inspections.html">Inspections</a>
      <a href="live-monitoring.html" class="active">Live Monitoring</a>
      <a href="#" title="Coming next">Users</a>
    </nav>

    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <span class="icon">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.6M12 18.6v2.6M4.6 4.6l1.9 1.9M17.5 17.5l1.9 1.9M2.8 12h2.6M18.6 12h2.6M4.6 19.4l1.9-1.9M17.5 6.5l1.9-1.9"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 14.4A8.4 8.4 0 1 1 9.6 3.8a6.7 6.7 0 0 0 10.6 10.6z"/></svg>
      </span>
      <span class="label"><span class="t-dark">Dark mode</span><span class="t-light">Light mode</span></span>
      <span class="switch"><span class="knob"></span></span>
    </button>

    <div class="user-box">
      <span class="name" id="user-name">Loading…</span>
      <span id="user-role"></span>
      <button id="logout-btn">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header>
      <h1>Live Monitoring</h1>
      <span class="meta" id="feed-count"></span>
    </header>

    <div class="feed-grid" id="feed-grid"></div>

    <div class="empty-state" id="empty-state" style="display:none;">
      <h3>No CCTV feeds configured</h3>
      <p>Add a feed URL when creating or editing a project to see it appear here.</p>
    </div>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/live-monitoring.js"></script>
</body>
</html>
